aid: kaleyra
url: https://raw.githubusercontent.com/api-evangelist/kaleyra/refs/heads/main/apis.yml
name: Kaleyra
kind: company
description: Kaleyra is a global omnichannel CPaaS provider (a Tata Communications
  company since October 2023) offering SMS, WhatsApp, RCS, Voice, Email, Verify (OTP),
  and Video communication APIs. Its REST APIs authenticate with an api-key header,
  address accounts by SID in the path, and are served from region-specific hosts for
  India, APAC, and EU data residency.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- CPaaS
- Messaging
- SMS
- WhatsApp
- Voice
- OTP
- India
created: '2026-07-17'
modified: '2026-07-17'
specificationVersion: '0.19'
apis:
- aid: kaleyra:kaleyra-sms-api
  name: Kaleyra SMS API
  tags:
  - SMS
  - Messaging
  - OTP
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.kaleyra.io/docs/sms-api
  baseURL: https://api.kaleyra.io
  properties:
