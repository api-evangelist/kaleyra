name: Kaleyra
kind: company
description: Kaleyra is a global omnichannel CPaaS provider (a Tata Communications
  company since October 2023) offering SMS, WhatsApp, RCS, Voice, Email, Verify (OTP),
  and Video communication APIs. Its REST APIs authenticate with an api-key header,
  address accounts by SID in the path, and are served from region-specific hosts for
  India, APAC, and EU data residency.
