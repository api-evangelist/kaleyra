  - url: https://developers.kaleyra.io/reference/single-sms-api
    type: APIReference
  - url: openapi/kaleyra-openapi.yml
    type: OpenAPI
  description: Send single and bulk SMS (MKT/TXN/OTP) via POST /v2/{sid}/messages,
    manage sender IDs and templates, and pull delivery status and logs. India DLT
    entity/template fields are supported.
