meters:
- name: sms_segments
  description: SMS segments sent, billed per segment by destination country/operator.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - country
  - type
- name: whatsapp_conversations
  description: WhatsApp conversations/templates billed by Meta category plus Kaleyra fee.
  unit: conversations
  aggregation: sum
  dimensions:
  - account
  - category
- name: rcs_messages
  description: RCS messages sent, billed per message by destination.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - country
- name: voice_minutes
  description: Voice minutes (click-to-call / outbound) billed per minute by destination.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - country
- name: verifications
  description: Verify/OTP verifications billed per verification plus channel delivery.
  unit: verifications
  aggregation: sum
  dimensions:
  - account
  - channel
- name: emails
  description: Transactional emails sent, billed per email / per 1,000.
  unit: emails
  aggregation: sum
  dimensions:
  - account
- name: video_participant_minutes
  description: Kaleyra Video participant-minutes plus recording/storage.
  unit: participant_minutes
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Pull per-channel, per-country usage from the kaleyra.io console / billing exports.
- name: Allocation
  description: Use subaccounts and API keys to map spend to teams, brands, and workloads.
- name: Optimization
  description: Route by cheapest compliant channel (e.g. WhatsApp utility vs SMS), consolidate templates, and monitor destination mix.
- name: Accountability
  description: Assign owners per subaccount; review destination-mix-driven cost monthly against budget.
