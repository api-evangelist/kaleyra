description: >-
  FinOps view of Kaleyra (a Tata Communications company) CPaaS spend. Kaleyra
  bills usage-based per-unit rates that vary by channel, destination country,
  and operator: per SMS segment, per WhatsApp conversation/template category,
  per RCS message, per voice minute, per verification, per email, and per video
  participant-minute. Costs are driven by destination mix and message volume;
  India traffic additionally carries DLT/operator scrubbing considerations.
notes: >-
  Per-country rates are quote-based and were not publicly confirmed in this
  pass; verify negotiated rate cards and any Tata Communications billing
  consolidation on reconciliation.
sources:
- https://www.kaleyra.com/
