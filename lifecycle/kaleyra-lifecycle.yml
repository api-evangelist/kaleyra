notes: >-
  Kaleyra versions its REST surface via URI path (v1 for verify/voice/older
  endpoints, v2 for messages/video/email). API and platform changes are
  published as dated release notes per channel. A public Atlassian Statuspage
  reports per-region service health. Deprecations are announced in the release
  notes (e.g. April 2024 removal of failover and SOIP API support, plus an SMS
  archival-policy notice) rather than via a standalone deprecation-policy page
  or RFC 8594 Sunset headers.
